name: build

# 三段式：
#   gate     每次 push / PR 都跑，格式 + lint + 测试
#   debug    任何分支的提交都出调试包（版本 X.Y.Z-dev.<run>），默认再发一条
#            rolling Pre-Release（tag = dev）；可以关掉只留 Actions 产物
#   release  打 v* 标签时出稳定版，发正式 Release
#
# 版本号只有一个来源：`scripts/version.rs`。CI 只通过环境变量影响它
# （`NOOKSILL_BUILD` = run number），不在这里拼字符串。
#
# 关掉 Pre-Release 的两种方式（测试流程用，不想让 Releases 页多一条）：
#   1. 仓库变量 DEBUG_PUBLISH = artifact（Settings → Variables）
#   2. 手动触发时把 publish 选成 artifact（只影响这一次）

on:
  push:
    # 任何分支：提交就出包
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: "debug 的发布方式"
        type: choice
        options: [pre-release, artifact]
        default: pre-release

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  # 增量缓存对 CI 无意义，关掉能少一类"本地好好的、CI 炸了"的问题。
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  TARGET: x86_64-pc-windows-msvc

jobs:
  gate:
    name: gate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: ilammy/msvc-dev-cmd@v1

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --target $env:TARGET --workspace --all-targets -- -D warnings

      - name: test
        # --lib --tests：跳过 doctest，与本地 `build.sh --gate` 一致。
        run: cargo test --target $env:TARGET --workspace --lib --tests

  debug:
    name: debug
    needs: gate
    # 打标签时走 release，这里不再重复出 debug。
    if: github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      # build.rs 会把它拼成 `X.Y.Z-dev.<run>`；release 档位不读这个变量。
      NOOKSILL_BUILD: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: ilammy/msvc-dev-cmd@v1

      - name: package
        shell: bash
        run: ./scripts/package.sh

      - name: read version
        id: ver
        shell: bash
        run: echo "value=$(tr -d '[:space:]' < target/$TARGET/debug/NOOKSILL_VERSION)" >> "$GITHUB_OUTPUT"

      # 发布方式是"手动输入 > 仓库变量 > 默认 pre-release"三级回落：
      # 变量改一次长期生效，手动输入只影响这一次。
      - name: resolve publish mode
        id: mode
        shell: bash
        run: |
          mode='${{ github.event.inputs.publish || vars.DEBUG_PUBLISH || 'pre-release' }}'
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "publish mode: $mode"

      # 产物无条件上传：即便是"仅 Actions"模式，测试也要有东西可下。
      # 给的是 .exe 与 .sha256 两个裸文件 —— GitHub 的 artifact 存储内部
      # 仍然是 zip 容器（它的机制，改不了），但下载解出来的就是这两个文件。
      - uses: actions/upload-artifact@v4
        with:
          name: NookSill-${{ steps.ver.outputs.value }}-win64-debug
          path: |
            dist/NookSill-${{ steps.ver.outputs.value }}-win64-debug.exe
            dist/NookSill-${{ steps.ver.outputs.value }}-win64-debug.exe.sha256
          if-no-files-found: error
          retention-days: 14

      # rolling Pre-Release：永远用同一个 tag，资产每次覆盖。
      # 只有主分支发布 —— 特性分支的验证包留在 Actions 里，免得 Releases 页被刷屏。
      - name: publish pre-release
        if: steps.mode.outputs.mode != 'artifact' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.value }}
        run: |
          set -euo pipefail
          tag=dev
          exe="dist/NookSill-$VERSION-win64-debug.exe"
          sum="$exe.sha256"
          sha8="${GITHUB_SHA:0:8}"

          {
            echo "Automated build of the \`dev\` channel — every commit to the default branch replaces this release."
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Version | \`$VERSION\` |"
            echo "| Build time | $(date -u '+%Y-%m-%d %H:%M:%S') UTC |"
            echo "| Commit | [\`$sha8\`](https://github.com/$GITHUB_REPOSITORY/commit/$GITHUB_SHA) |"
            echo "| Workflow run | [$GITHUB_RUN_NUMBER](https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) |"
            echo "| SHA-256 | \`$(cut -d' ' -f1 "$sum")\` |"
            echo
            echo "Stable builds: [latest release](https://github.com/$GITHUB_REPOSITORY/releases/latest)."
          } > debug-notes.md

          if ! gh release view "$tag" > /dev/null 2>&1; then
            gh release create "$tag" --prerelease --title "Development build" --notes-file debug-notes.md
          fi
          # 资产名带版本号，不清掉旧的会一直堆积。
          for name in $(gh release view "$tag" --json assets --jq '.assets[].name'); do
            gh release delete-asset "$tag" "$name" -y
          done
          gh release upload "$tag" "$exe" "$sum" --clobber
          gh release edit "$tag" --prerelease --title "Development build $VERSION" --notes-file debug-notes.md

  release:
    name: release
    needs: gate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: ilammy/msvc-dev-cmd@v1

      - name: tag matches Cargo version
        id: ver
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          echo "tag=$tag cargo=$version"
          if [ "$tag" != "$version" ]; then
            echo "::error::标签 v$tag 与 Cargo.toml 的 $version 不一致"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: package
        shell: bash
        run: ./scripts/package.sh --release

      - name: list artifacts
        shell: bash
        run: ls -l dist

      - name: release notes from changelog
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < target/$TARGET/release/NOOKSILL_VERSION)"
          awk -v v="$version" 'index($0, "## " v) == 1 { p = 1; next } /^## / { p = 0 } p' CHANGELOG.md > notes.md
          wc -l notes.md

      - uses: softprops/action-gh-release@v2
        with:
          name: NookSill ${{ steps.ver.outputs.version }}
          # 裸 exe + 校验和，不打 zip。
          files: |
            dist/*.exe
            dist/*.sha256
          body_path: notes.md
          fail_on_unmatched_files: true
          # 正式版：不是草稿、不是预发布，并抢下 "Latest" 角标。
          draft: false
          prerelease: false
          make_latest: "true"

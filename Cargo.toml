[workspace]
resolver = "2"
members = [
    "crates/minidock-core",
    "crates/minidock-platform",
    "crates/minidock-settings",
    "crates/minidock-gpu",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
# egui 0.37 / egui-wgpu 0.37 require 1.95.
rust-version = "1.95"
license = "GPL-3.0-or-later"
authors = ["MiniDock Rust port contributors"]
repository = ""

[workspace.dependencies]
minidock-core = { path = "crates/minidock-core" }
minidock-platform = { path = "crates/minidock-platform" }
minidock-settings = { path = "crates/minidock-settings" }
minidock-gpu = { path = "crates/minidock-gpu" }

# eframe owns the message loop. This app needs Win32 trampolines, hotkeys,
# AppBar and per-pixel hit testing, so only egui + egui-wgpu are used.
# wgpu is not declared separately: egui_wgpu::wgpu re-exports the exact
# version egui uses, which prevents device/surface type drift.
egui = { version = "0.37", features = ["default_fonts"] }
egui-wgpu = "0.37"
egui_kittest = "0.37"

# Only for icon pixel processing. The other jobs are IO-bound and run on
# dedicated threads in minidock-gpu::worker.
rayon = "1.12"

pollster = "1.0"

# Pinned rev: upstream can change the uniform layout without notice.
# Only capture (GDI BitBlt), blur CPU weights and SDF math are used (ADR-057).
# No swapchain in our pipeline: egui -> offscreen texture -> DIB -> ULW.
glass-backdrop = { git = "https://github.com/MCheng404/glass-backdrop-rs", rev = "747457c8290cc4c38e8ee4ac1b3cfaeb3cbd59ac" }

# Features are additive across the workspace, so they are declared once here.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_OpenGL",
    "Win32_Graphics_Dwm",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

# Size first, matching the C version. If animation frames become CPU-bound,
# add #[inline] to hot paths instead of switching to opt-level = 3.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

# Keep symbols so WinDbg / VS can attach to a crashing Rust process.
[profile.dev]
incremental = true

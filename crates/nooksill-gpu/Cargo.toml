[package]
name = "nooksill-gpu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "wgpu 离屏渲染 + egui 绘制 + Win32 输入/命中与分层窗口呈现"

[dependencies]
nooksill-core.workspace = true
nooksill-platform.workspace = true
nooksill-settings.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
pollster.workspace = true
rayon.workspace = true
windows.workspace = true
glass-backdrop.workspace = true

# 三个可执行文件全部显式声明。`src/bin/` 下的文件本来会被自动发现，
# 但显式列出后"这个 crate 产出哪几个 exe"一眼可见。
[[bin]]
name = "nooksill-dock"
path = "src/bin/dock.rs"

[[bin]]
name = "probe"
path = "src/bin/probe.rs"

[build-dependencies]
winresource = "0.1.34"

[package]
name = "minidock-gfx"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "GDI+ 的 RAII 封装与分层窗口画布"

[dependencies]
minidock-core.workspace = true
windows.workspace = true

# 本 crate 是 unsafe 的**唯一**入口之一（另一个是 minidock-platform）。
# 所有 raw pointer 都包在 newtype 里，drop 时释放；对外只暴露安全 API。
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
